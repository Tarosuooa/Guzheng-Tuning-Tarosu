<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>고쟁 음정 체크</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#241209;
    --wood-mid:#3c2013;
    --lacquer:#a13a2e;
    --lacquer-dark:#7c2a20;
    --gold:#c9a227;
    --string:#e9dfc6;
    --string-dim:#9c8f74;
    --cream:#f2e9d4;
    --ink:#1c120a;
    --teal:#2fd9c4;
    --teal-dim:#1c8c7d;
    --pitch-down:#5aa8e6;
    --pitch-up:#e0584a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at 30% -10%, #52301c 0%, transparent 70%),
      repeating-linear-gradient(100deg, var(--wood-dark) 0px, var(--wood-mid) 3px, var(--wood-dark) 6px),
      var(--wood-dark);
    background-attachment: fixed, fixed, fixed;
    color:var(--cream);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 60px;
    overflow-x:hidden;
  }

  header{ text-align:center; margin-bottom:6px; }
  .eyebrow{
    letter-spacing:0.35em; font-size:11px; color:var(--gold);
    text-transform:uppercase; margin-bottom:10px;
  }
  h1{
    font-family:'Noto Serif KR', serif; font-weight:900;
    font-size:clamp(32px, 6vw, 54px); margin:0; color:var(--cream);
    text-shadow:0 2px 0 var(--lacquer-dark), 0 4px 14px rgba(0,0,0,0.5);
    letter-spacing:0.04em;
  }
  .credit{
    text-align:center;
    font-size:12px;
    color:#c99a6b;
    margin-top:8px;
    letter-spacing:0.03em;
    opacity:0.4;
  }

  .control-bar{
    margin:24px 0 20px;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:22px;
    background:linear-gradient(180deg, #2c170c, #1c0f07);
    border:1px solid rgba(201,162,39,0.35);
    border-radius:18px;
    padding:14px 26px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.4);
  }
  .control-group{ display:flex; align-items:center; gap:10px; }
  .control-bar label{ font-size:13px; color:var(--gold); letter-spacing:0.06em; white-space:nowrap; }

  select{
    appearance:none; background:var(--ink); color:var(--cream);
    border:1px solid var(--gold); border-radius:8px;
    padding:8px 34px 8px 14px; font-family:'Noto Sans KR', sans-serif;
    font-size:14px; font-weight:600; cursor:pointer;
    background-image:linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  select:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .string:focus-visible{ outline:none; }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:140px; height:4px; border-radius:2px;
    background:linear-gradient(90deg, var(--gold), var(--string-dim));
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; border-radius:50%;
    background:var(--cream); border:2px solid var(--gold);
    cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.5);
  }
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background:var(--cream); border:2px solid var(--gold); cursor:pointer;
  }
  #volLabel{ font-size:12px; color:var(--string-dim); min-width:32px; }

  .volume-group{ flex-direction:column; align-items:flex-start; gap:8px; }
  .volume-row{ display:flex; align-items:center; gap:10px; }
  .volume-presets{ display:flex; gap:5px; }
  .vol-preset-btn{
    background:var(--ink); color:var(--string-dim);
    border:1px solid rgba(201,162,39,0.35); border-radius:6px;
    padding:3px 9px; font-family:'Noto Sans KR', sans-serif;
    font-size:11px; font-weight:600; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .vol-preset-btn:hover{ color:var(--cream); border-color:var(--gold); }
  .vol-preset-btn:active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  .vol-preset-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .toggle-group{ display:flex; gap:6px; }
  .toggle-btn{
    background:var(--ink); color:var(--string-dim);
    border:1px solid rgba(201,162,39,0.4); border-radius:8px;
    padding:7px 14px; font-family:'Noto Sans KR', sans-serif;
    font-size:13px; font-weight:600; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .toggle-btn:hover{ color:var(--cream); border-color:var(--gold); }
  .toggle-btn.active{
    background:var(--gold); color:var(--ink); border-color:var(--gold);
  }
  .toggle-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .tuner-panel{
    width:min(560px, 94vw);
    margin:0 0 22px;
    background:linear-gradient(180deg, #2c170c, #1c0f07);
    border:1px solid rgba(201,162,39,0.35);
    border-radius:16px;
    padding:20px 26px 18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.4);
    text-align:center;
  }
  .tuner-target{
    display:flex; align-items:baseline; justify-content:center; gap:10px;
    margin-bottom:14px;
  }
  .tuner-target-solfege{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:26px; color:var(--gold);
  }
  .tuner-target-note{ font-size:16px; color:var(--cream); font-weight:600; }
  .tuner-target-freq{ font-size:12px; color:var(--string-dim); }

  .tuner-meter{ max-width:360px; margin:0 auto 12px; }
  .tuner-meter-track{
    position:relative; height:10px; border-radius:6px;
    background:linear-gradient(90deg, #e0584a 0%, #e0584a 15%, var(--gold) 15%, var(--gold) 40%, #3fbf6f 40%, #3fbf6f 60%, var(--gold) 60%, var(--gold) 85%, #e0584a 85%, #e0584a 100%);
    opacity:0.9;
  }
  .tuner-meter-center-line{
    position:absolute; left:50%; top:-4px; width:2px; height:18px;
    background:var(--cream); opacity:0.6; transform:translateX(-1px);
  }
  .tuner-meter-needle{
    position:absolute; top:-7px; left:50%; width:4px; height:24px;
    background:var(--cream); border-radius:2px;
    box-shadow:0 0 8px 1px rgba(255,255,255,0.4);
    transition:left 0.08s linear, background 0.15s ease;
    transform:translateX(-2px);
  }
  .tuner-meter-needle.in-tune{ background:#3fbf6f; box-shadow:0 0 10px 2px rgba(63,191,111,0.7); }
  .tuner-meter-needle.close{ background:var(--gold); }
  .tuner-meter-needle.off{ background:#e0584a; }
  .tuner-meter-scale{
    display:flex; justify-content:space-between; font-size:10px; color:var(--string-dim);
    margin-top:6px;
  }

  .tuner-readout{
    display:flex; flex-wrap:wrap; justify-content:center; gap:16px;
    font-size:13px; color:var(--string-dim); margin-bottom:8px;
  }
  #tunerStatus{ color:var(--gold); font-weight:600; }
  #tunerCents{ font-variant-numeric:tabular-nums; }

  .tuner-hint{ font-size:11px; color:var(--string-dim); line-height:1.6; }

  .string{ touch-action:pan-y; } /* 세로 스크롤은 허용하고, 가로 스와이프는 JS가 직접 처리 */

  .instrument{
    position:relative;
    width:min(760px, 96vw);
    background:linear-gradient(180deg, #4a2a17, #2f1a0e 70%, #241209);
    border-radius:20px;
    padding:36px 36px 42px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.06),
      inset 0 -30px 60px rgba(0,0,0,0.45),
      0 30px 60px rgba(0,0,0,0.55);
    border:1px solid rgba(0,0,0,0.5);
  }
  .instrument::before{
    content:""; position:absolute; inset:12px;
    border:1px solid rgba(201,162,39,0.18); border-radius:14px; pointer-events:none;
  }

  .strings{ display:flex; flex-direction:column; gap:8px; }

  .string{
    background:none; border:none; padding:0; cursor:pointer;
    display:flex; align-items:center; gap:18px;
    width:100%; height:26px;
    -webkit-tap-highlight-color:transparent;
    border-radius:8px;
  }
  .string .idx{
    width:32px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    line-height:1;
  }
  .string .idx-num{
    font-size:14px; color:var(--string-dim); font-weight:600;
  }
  .string .idx-dots{
    font-size:7px; letter-spacing:1px; color:var(--string-dim);
    height:7px; line-height:7px;
  }
  .string .wire{
    height:5px; border-radius:3px;
    background:linear-gradient(90deg, var(--string), var(--string-dim));
    transition:box-shadow 0.15s ease, background 0.15s ease;
    transform-origin:left center;
  }
  .string.sol .wire{ background:linear-gradient(90deg, var(--teal), var(--teal-dim)); }

  .string .label{
    display:flex; align-items:baseline; gap:10px; flex-shrink:0;
  }
  .string .solfege{
    font-family:'Noto Serif KR', serif; font-size:19px; font-weight:600; color:var(--gold);
    width:28px; transition:color 0.15s ease;
  }
  .string.sol .solfege{ color:var(--teal); }

  .string .note{ font-size:14px; color:var(--string-dim); font-weight:600; transition:color 0.15s ease; }
  .string .note.lowered{ color:var(--pitch-down); }
  .string .note.raised{ color:var(--pitch-up); }

  .string:hover .wire{ background:linear-gradient(90deg, #fff5da, var(--gold)); }
  .string.sol:hover .wire{ background:linear-gradient(90deg, #baf5ec, var(--teal)); }

  .string.selected{ background:rgba(201,162,39,0.12); }
  .string.selected .idx-num{ color:var(--gold); }
  .string.selected .idx-dots{ color:var(--gold); }
  .string.selected .wire{ box-shadow:0 0 0 1px rgba(201,162,39,0.6); }

  .string.plucking .wire{
    animation:pluck 0.45s ease-out;
    box-shadow:0 0 12px 2px rgba(255,215,120,0.55);
  }
  .string.sol.plucking .wire{ box-shadow:0 0 12px 2px rgba(47,217,196,0.55); }
  @keyframes pluck{
    0%{ transform: scaleY(1) translateY(0); }
    20%{ transform: scaleY(2.6) translateY(-1px); }
    45%{ transform: scaleY(2.1) translateY(1px); }
    70%{ transform: scaleY(1.3) translateY(-0.5px); }
    100%{ transform: scaleY(1) translateY(0); }
  }
</style>
</head>
<body>

<header>
  <h1>고쟁 음정 체크</h1>
  <div class="credit">현재 본인의 고쟁 음(音)과 얼마나 유사한지 피아노 소리를 통해 비교하는 툴입니다.</div>
  <div class="credit">Developed by Tarosu</div>
</header>

<div class="control-bar">
  <div class="control-group">
    <label>현 수</label>
    <div class="toggle-group">
      <button type="button" id="btn21" class="toggle-btn active">21현</button>
      <button type="button" id="btn14" class="toggle-btn">14현</button>
    </div>
  </div>
  <div class="control-group">
    <label for="keySelect">장조</label>
    <select id="keySelect"></select>
  </div>
  <div class="control-group volume-group">
    <div class="volume-row">
      <label for="volume">볼륨</label>
      <input type="range" id="volume" min="0" max="100" value="15">
      <span id="volLabel">15%</span>
    </div>
    <div class="volume-presets">
      <button type="button" class="vol-preset-btn" data-vol="15">15%</button>
      <button type="button" class="vol-preset-btn" data-vol="50">50%</button>
      <button type="button" class="vol-preset-btn" data-vol="70">70%</button>
      <button type="button" class="vol-preset-btn" data-vol="100">100%</button>
    </div>
  </div>
  <div class="control-group">
    <button type="button" id="btnMultiRun" class="toggle-btn">연속음 OFF</button>
  </div>
  <div class="control-group">
    <button type="button" id="btnTuning" class="toggle-btn">🎙 튜닝</button>
  </div>
</div>

<div class="tuner-panel" id="tunerPanel" hidden>
  <div class="tuner-target">
    <span class="tuner-target-solfege" id="tunerSolfege">도</span>
    <span class="tuner-target-note" id="tunerNote">C4</span>
    <span class="tuner-target-freq" id="tunerTargetFreq">261.6 Hz</span>
  </div>

  <div class="tuner-meter">
    <div class="tuner-meter-track">
      <div class="tuner-meter-center-line"></div>
      <div class="tuner-meter-needle" id="tunerNeedle"></div>
    </div>
    <div class="tuner-meter-scale">
      <span>♭ -50¢</span><span>0</span><span>+50¢ ♯</span>
    </div>
  </div>

  <div class="tuner-readout">
    <span id="tunerStatus">마이크 권한을 허용해 주세요</span>
    <span id="tunerFreq">-- Hz</span>
    <span id="tunerCents">-- ¢</span>
  </div>

  <div class="tuner-hint">방향키로 목표 음을 고른 뒤, 실제 고쟁 현을 뜯어 소리를 들려주세요. 스피커 소리가 마이크로 다시 들어가면 정확도가 떨어질 수 있어요.</div>
</div>

<div class="instrument">
  <div class="strings" id="strings"></div>
</div>

<script>
(function(){
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const PENTATONIC = [0,2,4,7,9]; // 장음계 오음계 구조 (으뜸음 기준 1,2,3,5,6도)
  const SOLFEGE = ['도','레','미','솔','라']; // 스케일 상의 자리를 가리키는 계이름 - 장조가 바뀌어도 항상 이 5글자만 사용
  const STRING_COUNT = 21;

  const keySelect = document.getElementById('keySelect');
  NOTE_NAMES.forEach((name, offset) => {
    const opt = document.createElement('option');
    opt.value = offset;
    opt.textContent = name + ' 장조' + (name === 'D' ? ' (기본)' : '');
    keySelect.appendChild(opt);
  });
  keySelect.value = 2; // D

  function midiToFreq(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }
  function midiToLabel(midi){
    const pc = ((midi % 12) + 12) % 12;
    const oct = Math.floor(midi / 12) - 1;
    return NOTE_NAMES[pc] + oct;
  }

  function buildTuning(rootOffset){
    const tonicMidiOct2 = 36 + rootOffset;
    const midis = [];
    for(let i=1; i<=STRING_COUNT; i++){
      const degree = (i - 1) % 5;
      const octAdd = Math.floor((i - 1) / 5);
      midis.push(tonicMidiOct2 + PENTATONIC[degree] + octAdd * 12);
    }
    return midis;
  }

  // --- Audio ---
  const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let masterGain = null;
  const bufferCache = {};

  function getAudioCtx(){
    if(!audioCtx){
      audioCtx = new AudioCtxClass();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = parseInt(document.getElementById('volume').value, 10) / 100;
      masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  // Additive piano voice: a stack of harmonics, each with its own decay time
  // (highs die faster than the fundamental, like a real hammer-struck
  // string), plus slight inharmonicity (stiff-string stretch) and a short
  // filtered noise "hammer" transient at the very start. Single mono voice,
  // random per-harmonic phase - no unison detune, no chorus/shimmer, so it
  // reads as a dry acoustic strike rather than a synth pad.
  const HARMONIC_AMPS = [1, 0.55, 0.30, 0.17, 0.10, 0.06, 0.035, 0.02];
  const INHARMONICITY = 0.00018;

  function buildPianoVoice(sampleRate, freq, totalSamples, tauBase){
    const out = new Float32Array(totalSamples);
    const nyquistGuard = sampleRate * 0.45;

    for(let h = 1; h <= HARMONIC_AMPS.length; h++){
      const stretch = Math.sqrt(1 + INHARMONICITY * h * h);
      const fh = freq * h * stretch;
      if(fh > nyquistGuard) break;
      const amp = HARMONIC_AMPS[h - 1];
      const tauH = tauBase / (1 + (h - 1) * 0.32); // upper partials decay quicker - keeps it dry, not ringy
      const w = 2 * Math.PI * fh / sampleRate;
      const phase = Math.random() * Math.PI * 2;
      for(let i = 0; i < totalSamples; i++){
        out[i] += amp * Math.sin(w * i + phase) * Math.exp(-i / (tauH * sampleRate));
      }
    }

    // hammer strike: short, fairly hard noise burst at the very start of the note
    const hammerSamples = Math.min(totalSamples, Math.floor(sampleRate * 0.018));
    for(let i = 0; i < hammerSamples; i++){
      out[i] += (Math.random() * 2 - 1) * 0.22 * Math.exp(-i / (hammerSamples * 0.3));
    }

    // fast attack ramp so the sine sum doesn't click on at full amplitude
    const attackSamples = Math.max(1, Math.floor(sampleRate * 0.002));
    for(let i = 0; i < attackSamples; i++) out[i] *= i / attackSamples;

    return out;
  }

  function pianoBuffer(ctx, freq){
    const key = Math.round(freq * 100);
    if(bufferCache[key]) return bufferCache[key];

    const sampleRate = ctx.sampleRate;
    // 서스테인을 거의 없애고, 타건 직후 바로 끊기는 퍼커시브한 소리로
    const tauBase = clamp(60 / freq, 0.06, 0.22);
    const duration = clamp(tauBase * 1.8, 0.12, 0.35);
    const totalSamples = Math.floor(duration * sampleRate);

    const voice = buildPianoVoice(sampleRate, freq, totalSamples, tauBase);

    const fadeSamples = Math.max(1, Math.floor(totalSamples * 0.08));
    const fadeStart = totalSamples - fadeSamples;

    const out = new Float32Array(totalSamples);
    let peak = 0;
    for(let i = 0; i < totalSamples; i++){
      const tailGain = i >= fadeStart ? (totalSamples - i) / fadeSamples : 1;
      const v = voice[i] * tailGain;
      out[i] = v;
      const m = Math.abs(v);
      if(m > peak) peak = m;
    }
    const norm = peak > 0 ? 0.9 / peak : 1;
    for(let i = 0; i < totalSamples; i++){ out[i] *= norm; }

    const buffer = ctx.createBuffer(1, totalSamples, sampleRate);
    buffer.copyToChannel(out, 0);
    bufferCache[key] = buffer;
    return buffer;
  }

  function playNote(freq){
    const ctx = getAudioCtx();
    const buffer = pianoBuffer(ctx, freq);

    const source = ctx.createBufferSource();
    source.buffer = buffer;

    // remove sub-rumble so nothing reads as boomy/resonant
    const highpass = ctx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 45;

    // tame any harshness above the audible piano range - no added ring, just a gentle cut
    const smooth = ctx.createBiquadFilter();
    smooth.type = 'lowpass';
    smooth.frequency.value = 8500;
    smooth.Q.value = 0.6;

    source.connect(highpass);
    highpass.connect(smooth);
    smooth.connect(masterGain);
    source.start();
  }

  // --- Volume control ---
  const volumeSlider = document.getElementById('volume');
  const volLabel = document.getElementById('volLabel');

  function setVolume(v){
    volumeSlider.value = v;
    volLabel.textContent = v + '%';
    if(masterGain) masterGain.gain.value = v / 100;
  }

  volumeSlider.addEventListener('input', () => {
    setVolume(parseInt(volumeSlider.value, 10));
  });

  document.querySelectorAll('.vol-preset-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      setVolume(parseInt(btn.dataset.vol, 10));
    });
  });

  // 모바일(터치 기기)에서는 기본 볼륨을 50%로 - PC는 기존 기본값(15%) 유지
  const isMobile = window.matchMedia('(pointer: coarse)').matches
    || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile) setVolume(50);

  // --- 튜너 DOM 참조 (refresh()가 처음 호출되기 전에 준비되어 있어야 함) ---
  const btnTuning = document.getElementById('btnTuning');
  const tunerPanel = document.getElementById('tunerPanel');
  const tunerSolfege = document.getElementById('tunerSolfege');
  const tunerNote = document.getElementById('tunerNote');
  const tunerTargetFreq = document.getElementById('tunerTargetFreq');
  const tunerNeedle = document.getElementById('tunerNeedle');
  const tunerStatus = document.getElementById('tunerStatus');
  const tunerFreq = document.getElementById('tunerFreq');
  const tunerCents = document.getElementById('tunerCents');

  let tunerActive = false;
  let micStream = null;
  let micSource = null;
  let analyser = null;
  let tunerTimeData = null;
  let tunerRAF = null;

  // --- 연속음(N회 다중 재생) 기능 ON/OFF ---
  let multiRunEnabled = false;
  const btnMultiRun = document.getElementById('btnMultiRun');
  btnMultiRun.addEventListener('click', () => {
    multiRunEnabled = !multiRunEnabled;
    btnMultiRun.classList.toggle('active', multiRunEnabled);
    btnMultiRun.textContent = multiRunEnabled ? '연속음 ON' : '연속음 OFF';
  });

  // --- UI: build 21 strings, stacked vertically, top = string1 (도, lowest) ---
  const stringsEl = document.getElementById('strings');
  let tuning = buildTuning(parseInt(keySelect.value, 10));
  let selectedIndex = 0;
  const semitoneOffsets = new Array(STRING_COUNT).fill(0); // per-string manual pitch-check adjustment

  // 숫자키(또는 모바일 빠른 다중 탭) N회에 대응하는 오프셋 조합.
  // 이 화면은 위쪽이 낮은 음, 아래쪽이 높은 음이라 "위"는 곧 음이 낮은 방향(-오프셋)이다.
  // N~2: 선택음 기준 (N-1)칸 위쪽 현에서부터 시작해, 순서대로 내려오며 선택음에서 끝난다.
  // 0은 10개짜리로 취급한다 (키보드에 10이 없어서 0으로 표기).
  function buildRunOffsets(count){
    const offs = [];
    for(let k = count - 1; k >= 0; k--) offs.push(-k); // 예: count=3 -> [-2,-1,0]
    return offs;
  }
  const RUN_OFFSETS_BY_COUNT = {};
  for(let n = 2; n <= 9; n++) RUN_OFFSETS_BY_COUNT[n] = buildRunOffsets(n);
  RUN_OFFSETS_BY_COUNT[0] = buildRunOffsets(10); // 위쪽 10개에서 시작해 선택음에서 끝남

  const RUN_STEP_MS = 220; // 연속 재생 음 사이의 간격 (천천히 재생)

  // 현재 선택된 현을 기준으로 주어진 오프셋들을(아래→위 순서로) 차례로 연주한다.
  // 선택 상태(selectedIndex)는 바꾸지 않고 소리만 재생하며, 범위를 벗어나면 가장자리 값으로 고정한다.
  function playNoteRun(offsets){
    const lb = lowerBound();
    const ub = STRING_COUNT - 1;
    offsets.forEach((off, k) => {
      const idx = Math.max(lb, Math.min(ub, selectedIndex + off));
      setTimeout(() => pluck(idx), k * RUN_STEP_MS);
    });
  }

  // 14현 모드: 21현 중 위쪽 14개(기본 C장조 기준 미(E3)~도(C6))만 표시
  const FOURTEEN_START = 7; // 0-based index of string 8
  let stringMode = 21;

  function lowerBound(){ return stringMode === 14 ? FOURTEEN_START : 0; }

  function widthFor(i){
    // longest bar (bass, top) to shortest bar (treble, bottom) - like the tapered guzheng body
    const maxW = 100, minW = 34;
    const t = i / (STRING_COUNT - 1);
    return maxW - t * (maxW - minW);
  }

  const stringEls = [];
  const SWIPE_STEP_PX = 28; // 이 거리(px)만큼 가로로 밀 때마다 반음 1개씩 조절
  const DEGREE_NUMBERS = [1, 2, 3, 5, 6]; // 오음계 도수 표기 (도레미솔라 = 1,2,3,5,6)

  for(let i=0;i<STRING_COUNT;i++){
    const btn = document.createElement('button');
    btn.className = 'string';
    btn.setAttribute('aria-label', (i+1) + '번 현');

    const idx = document.createElement('div');
    idx.className = 'idx';
    const dotsAbove = document.createElement('div');
    dotsAbove.className = 'idx-dots idx-dots-above';
    const num = document.createElement('div');
    num.className = 'idx-num';
    num.textContent = i + 1;
    const dotsBelow = document.createElement('div');
    dotsBelow.className = 'idx-dots idx-dots-below';
    idx.appendChild(dotsAbove);
    idx.appendChild(num);
    idx.appendChild(dotsBelow);

    const wire = document.createElement('div');
    wire.className = 'wire';
    wire.style.width = widthFor(i) + '%';

    const label = document.createElement('div');
    label.className = 'label';
    const solfege = document.createElement('span');
    solfege.className = 'solfege';
    const note = document.createElement('span');
    note.className = 'note';
    label.appendChild(solfege);
    label.appendChild(note);

    btn.appendChild(idx);
    btn.appendChild(wire);
    btn.appendChild(label);
    stringsEl.appendChild(btn);
    stringEls.push({btn, wire, solfege, note, num, dotsAbove, dotsBelow});

    btn.addEventListener('click', () => {
      selectString(i);
      pluck(i);
    });

    // --- 모바일: 좌우로 슬라이드하면 반음씩 조절, 짧게 탭하면 그대로 재생 ---
    // touch identifier로 손가락을 구분해서 여러 현을 동시에 눌러도 서로 간섭하지 않도록 처리
    let activeTouchId = null, touchStartX = 0, touchStartY = 0, appliedSteps = 0, isHorizontalSwipe = false, didSwipe = false;
    let tapCount = 0, tapTimer = null;
    const TAP_WINDOW_MS = 320; // 이 시간 안에 다시 탭하면 같은 다중 탭으로 취급

    function findTouch(touchList){
      for(let k = 0; k < touchList.length; k++){
        if(touchList[k].identifier === activeTouchId) return touchList[k];
      }
      return null;
    }

    btn.addEventListener('touchstart', (e) => {
      if(activeTouchId !== null) return; // 이미 이 현을 누르고 있는 손가락이 있으면 무시
      const t = e.changedTouches[0];
      activeTouchId = t.identifier;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      appliedSteps = 0;
      isHorizontalSwipe = false;
      didSwipe = false;
      selectString(i);
    }, {passive:true});

    btn.addEventListener('touchmove', (e) => {
      if(activeTouchId === null) return;
      const t = findTouch(e.touches);
      if(!t) return;
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;

      if(!isHorizontalSwipe && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){
        isHorizontalSwipe = true;
      }
      if(isHorizontalSwipe){
        e.preventDefault(); // 세로 스크롤 방지, 이 제스처는 반음 조절 전용
        // 방향 반전: 오른쪽으로 밀면 내려가고(파랑), 왼쪽으로 밀면 올라감(빨강)
        const steps = Math.trunc(-dx / SWIPE_STEP_PX);
        if(steps !== appliedSteps){
          adjustSemitone(i, steps - appliedSteps);
          appliedSteps = steps;
          didSwipe = true;
          // 스와이프로 전환되면 진행 중이던 다중 탭 카운트는 취소
          tapCount = 0;
          if(tapTimer){ clearTimeout(tapTimer); tapTimer = null; }
        }
      }
    }, {passive:false});

    function endTouch(e){
      if(activeTouchId === null) return;
      const t = findTouch(e.changedTouches);
      if(!t) return;
      e.preventDefault(); // 이 터치 시퀀스에 대한 합성 click을 항상 막고, 아래에서 직접 처리한다
      if(!didSwipe && e.type === 'touchend'){
        if(!multiRunEnabled){
          // 연속음 기능이 꺼져 있으면, 몇 번을 두드리든 항상 그 음 하나만 즉시 재생
          pluck(i);
        } else {
          // 짧은 시간 안에 몇 번 탭했는지 세어서, PC의 숫자키와 동일하게 재생한다 (최대 10회).
          tapCount++;
          if(tapTimer) clearTimeout(tapTimer);
          tapTimer = setTimeout(() => {
            const n = Math.min(tapCount, 10);
            if(n === 1){
              pluck(i);
            } else {
              const savedSelected = selectedIndex;
              selectedIndex = i; // 이 현을 기준으로 오프셋 계산 (선택 하이라이트 자체는 바꾸지 않음)
              playNoteRun(buildRunOffsets(n));
              selectedIndex = savedSelected;
            }
            tapCount = 0;
            tapTimer = null;
          }, TAP_WINDOW_MS);
        }
      }
      activeTouchId = null;
    }
    btn.addEventListener('touchend', endTouch, {passive:false});
    btn.addEventListener('touchcancel', endTouch, {passive:false});
  }

  function refresh(){
    tuning.forEach((baseMidi, i) => {
      const degree = i % 5;
      const el = stringEls[i];
      const offset = semitoneOffsets[i];
      const midi = baseMidi + offset;

      // 계이름은 항상 도/레/미/솔/라 중 하나 - 장조나 반음 조절과 무관하게 스케일 자리를 나타냄
      el.solfege.textContent = SOLFEGE[degree];
      // 실제 절대음(피아노 음이름)은 조옮김·반음 조절에 따라 정확히 갱신
      el.note.textContent = midiToLabel(midi);
      el.note.classList.toggle('lowered', offset < 0);
      el.note.classList.toggle('raised', offset > 0);

      // 오음계 구조상 완전5도(솔) 자리는 구조적으로 계속 표시 (현재 조옮김과 무관)
      el.btn.classList.toggle('sol', degree === 3);
    });
    updateTunerTarget();
  }
  refresh();

  function selectString(i){
    stringEls[selectedIndex].btn.classList.remove('selected');
    selectedIndex = i;
    const btn = stringEls[selectedIndex].btn;
    btn.classList.add('selected');
    btn.focus({preventScroll:true}); // keep real DOM focus in sync with the visual highlight
    btn.scrollIntoView({block:'nearest', behavior:'smooth'});
    updateTunerTarget();
  }
  selectString(0);
  updateIdxDisplay();

  function pluck(i){
    const midi = tuning[i] + semitoneOffsets[i];
    playNote(midiToFreq(midi));
    const btn = stringEls[i].btn;
    btn.classList.remove('plucking');
    void btn.offsetWidth;
    btn.classList.add('plucking');
  }
  stringEls.forEach(({btn}) => btn.addEventListener('animationend', () => btn.classList.remove('plucking')));

  keySelect.addEventListener('change', () => {
    tuning = buildTuning(parseInt(keySelect.value, 10));
    refresh();
  });

  // --- 21현 / 14현 토글 ---
  const btn21 = document.getElementById('btn21');
  const btn14 = document.getElementById('btn14');

  function applyStringMode(){
    stringEls.forEach(({btn}, i) => {
      btn.style.display = (stringMode === 14 && i < FOURTEEN_START) ? 'none' : 'flex';
    });
    updateIdxDisplay();
    if(selectedIndex < lowerBound()) selectString(lowerBound());
  }

  // 왼쪽 숫자를 오음계 도수(1,2,3,5,6 반복)로, 옥타브는 숫자 위/아래 점으로 표시
  // (맨 위=가장 낮은 옥타브 → 아래에 점 2개, 가운데 옥타브 → 점 없음, 맨 아래=가장 높은 옥타브 → 위에 점 2개)
  // 21현 절대 인덱스 기준으로 계산하므로, 14현(위쪽 14개만 보이는 부분집합)에도 자연히 같은 규칙이 이어진다
  // (14현의 맨 윗줄은 index 7 → 도수 3, 아래에 점 1개)
  function updateIdxDisplay(){
    stringEls.forEach((el, i) => {
      const degree = i % 5;
      const g = Math.floor(i / 5); // 0(맨 위, 최저 옥타브) ~ 4(맨 아래, 최고 옥타브)
      const belowCount = Math.max(0, 2 - g);
      const aboveCount = Math.max(0, g - 2);
      el.num.textContent = DEGREE_NUMBERS[degree];
      el.dotsBelow.textContent = '•'.repeat(belowCount);
      el.dotsAbove.textContent = '•'.repeat(aboveCount);
      el.dotsBelow.style.visibility = belowCount ? 'visible' : 'hidden';
      el.dotsAbove.style.visibility = aboveCount ? 'visible' : 'hidden';
    });
  }

  btn21.addEventListener('click', () => {
    stringMode = 21;
    btn21.classList.add('active');
    btn14.classList.remove('active');
    applyStringMode();
  });
  btn14.addEventListener('click', () => {
    stringMode = 14;
    btn14.classList.add('active');
    btn21.classList.remove('active');
    applyStringMode();
  });

  function adjustSemitone(i, delta){
    semitoneOffsets[i] = clamp(semitoneOffsets[i] + delta, -12, 12);
    refresh(); // 소리는 내지 않고 표시만 갱신 - 재생은 스페이스바로
  }

  // --- Keyboard: Up/Down select, Left/Right semitone adjust, Space play, 0,2~9=다중 연주 ---
  const runFiredCodes = new Set();

  document.addEventListener('keydown', (e) => {
    const active = document.activeElement;
    const isFormControl = active && (active.tagName === 'SELECT' || active.tagName === 'INPUT');
    if(isFormControl) return;

    // e.code는 키보드 배치/언어/대소문자와 무관하게 물리적 키 위치를 가리킨다
    const RUN_KEY_COUNT = { Digit0: 0, Numpad0: 0 };
    for(let n = 2; n <= 9; n++){ RUN_KEY_COUNT['Digit' + n] = n; RUN_KEY_COUNT['Numpad' + n] = n; }

    if(e.code in RUN_KEY_COUNT){
      e.preventDefault();
      if(!multiRunEnabled){
        // 연속음 기능이 꺼져 있으면 숫자키는 선택음 1회 재생으로 대체
        pluck(selectedIndex);
        return;
      }
      if(!runFiredCodes.has(e.code)){
        runFiredCodes.add(e.code);
        playNoteRun(RUN_OFFSETS_BY_COUNT[RUN_KEY_COUNT[e.code]]);
      }
      return;
    }

    if(e.key === 'ArrowDown'){
      e.preventDefault();
      selectString(Math.min(STRING_COUNT - 1, selectedIndex + 1));
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      selectString(Math.max(lowerBound(), selectedIndex - 1));
    } else if(e.key === 'ArrowLeft'){
      e.preventDefault();
      adjustSemitone(selectedIndex, -1); // 내림 -> 파란색
    } else if(e.key === 'ArrowRight'){
      e.preventDefault();
      adjustSemitone(selectedIndex, 1); // 올림 -> 붉은색
    } else if(e.code === 'Space' || e.code === 'Digit1' || e.code === 'Numpad1'){
      e.preventDefault();
      pluck(selectedIndex);
    }
  });

  document.addEventListener('keyup', (e) => {
    runFiredCodes.delete(e.code);
  });

  // --- 튜닝 테스트: 마이크로 실제 연주음을 잡아 선택된 목표음과 비교 ---
  function currentTargetMidi(){
    return tuning[selectedIndex] + semitoneOffsets[selectedIndex];
  }

  function updateTunerTarget(){
    if(!tunerSolfege) return; // guard: called before DOM refs exist during initial refresh()
    const degree = selectedIndex % 5;
    const midi = currentTargetMidi();
    tunerSolfege.textContent = SOLFEGE[degree];
    tunerNote.textContent = midiToLabel(midi);
    tunerTargetFreq.textContent = midiToFreq(midi).toFixed(1) + ' Hz';
  }

  // 표준 자기상관(autocorrelation) 기반 피치 검출.
  // 조용한 소리도 잘 잡히도록, 분석 전에 입력을 자동으로 정규화(증폭)한다.
  function autoCorrelate(buf, sampleRate){
    const SIZE = buf.length;

    // 1) 진짜 무음인지 걸러낸다 (원래 기준보다 약간만 더 민감하게)
    let peak = 0;
    for(let i = 0; i < SIZE; i++){ const a = Math.abs(buf[i]); if(a > peak) peak = a; }
    if(peak < 0.006) return -1;

    // 2) 자동 게인: 작은 소리를 살짝만 보정 (최대 6배까지) - 과하게 증폭하지 않음
    const gain = Math.min(6, 0.8 / peak);
    const norm = new Float32Array(SIZE);
    for(let i = 0; i < SIZE; i++) norm[i] = buf[i] * gain;

    let r1 = 0, r2 = SIZE - 1;
    const thres = 0.2;
    for(let i = 0; i < SIZE / 2; i++){ if(Math.abs(norm[i]) < thres){ r1 = i; break; } }
    for(let i = 1; i < SIZE / 2; i++){ if(Math.abs(norm[SIZE - i]) < thres){ r2 = SIZE - i; break; } }

    const trimmed = norm.slice(r1, r2);
    const n = trimmed.length;
    if(n < 8) return -1;

    const c = new Float32Array(n);
    for(let lag = 0; lag < n; lag++){
      let sum = 0;
      for(let i = 0; i < n - lag; i++) sum += trimmed[i] * trimmed[i + lag];
      c[lag] = sum;
    }

    let d = 0;
    while(d < n - 1 && c[d] > c[d + 1]) d++;

    let maxVal = -1, maxPos = -1;
    for(let i = d; i < n; i++){
      if(c[i] > maxVal){ maxVal = c[i]; maxPos = i; }
    }
    if(maxPos <= 0 || maxPos >= n - 1) return -1;

    // 포물선 보간으로 더 정밀한 주기 추정
    const x1 = c[maxPos - 1], x2 = c[maxPos], x3 = c[maxPos + 1];
    const a = (x1 + x3 - 2 * x2) / 2;
    const b = (x3 - x1) / 2;
    const shift = a ? -b / (2 * a) : 0;
    const period = maxPos + shift;
    if(period <= 0) return -1;
    return sampleRate / period;
  }

  function tunerLoop(){
    if(!tunerActive) return;
    analyser.getFloatTimeDomainData(tunerTimeData);
    const freq = autoCorrelate(tunerTimeData, audioCtx.sampleRate);

    if(freq > 0 && freq < 2000){
      const targetFreq = midiToFreq(currentTargetMidi());
      const cents = 1200 * Math.log2(freq / targetFreq);
      const clamped = clamp(cents, -50, 50);
      const pct = 50 + (clamped / 50) * 50; // 0~100%
      tunerNeedle.style.left = pct + '%';

      tunerNeedle.classList.remove('in-tune', 'close', 'off');
      let statusText;
      if(Math.abs(cents) <= 5){
        tunerNeedle.classList.add('in-tune');
        statusText = '정확해요 ✓';
      } else if(Math.abs(cents) <= 20){
        tunerNeedle.classList.add('close');
        statusText = cents > 0 ? '조금 높아요 ♯' : '조금 낮아요 ♭';
      } else {
        tunerNeedle.classList.add('off');
        statusText = cents > 0 ? '많이 높아요 ♯' : '많이 낮아요 ♭';
      }
      tunerStatus.textContent = statusText;
      tunerFreq.textContent = freq.toFixed(1) + ' Hz';
      tunerCents.textContent = (cents > 0 ? '+' : '') + cents.toFixed(0) + ' ¢';
    } else {
      tunerNeedle.classList.remove('in-tune', 'close', 'off');
      tunerNeedle.style.left = '50%';
      tunerStatus.textContent = '고쟁 현을 뜯어 소리를 들려주세요';
      tunerFreq.textContent = '-- Hz';
      tunerCents.textContent = '-- ¢';
    }

    tunerRAF = requestAnimationFrame(tunerLoop);
  }

  async function startTuner(){
    try{
      // 이미 차단된 상태면 getUserMedia를 다시 불러도 OS가 팝업을 띄우지 않으므로
      // Permissions API로 먼저 상태를 확인해 더 정확한 안내를 준다.
      if(navigator.permissions && navigator.permissions.query){
        try{
          const status = await navigator.permissions.query({ name: 'microphone' });
          if(status.state === 'denied'){
            alert(
              '마이크 권한이 꺼져 있어요.\n\n' +
              '웹 앱은 보안 정책상 스스로 설정 화면을 열 수 없어서, 아래 경로로 직접 이동해 허용해 주세요.\n\n' +
              '• 안드로이드: 휴대폰 설정 › 앱 › 고쟁 음정 체크 › 권한 › 마이크 → 허용\n' +
              '• iOS(홈 화면에 추가한 경우): 설정 › Safari(또는 사용 중인 브라우저) › 마이크 → 허용\n\n' +
              '한 번 허용해 두면 다음부터는 이 버튼을 누르는 즉시 팝업 없이 바로 튜닝이 시작돼요.'
            );
            return;
          }
        } catch(permErr){
          // Safari 등 microphone 권한 조회를 지원하지 않는 브라우저는 그냥 아래로 진행
        }
      }

      // 권한이 이미 허용된 상태면 팝업 없이 즉시 진행되고,
      // 아직 물어본 적 없는 상태(prompt)면 여기서 OS 권한 팝업이 뜬다.
      micStream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation:false, noiseSuppression:false, autoGainControl:false
      } });

      const ctx = getAudioCtx();
      micSource = ctx.createMediaStreamSource(micStream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      tunerTimeData = new Float32Array(analyser.fftSize);
      micSource.connect(analyser); // destination에는 연결하지 않음 - 마이크 소리를 스피커로 내보내지 않음

      tunerActive = true;
      btnTuning.classList.add('active');
      btnTuning.textContent = '🎙 튜닝 중지';
      tunerPanel.hidden = false;
      tunerStatus.textContent = '고쟁 현을 뜯어 소리를 들려주세요';
      updateTunerTarget();
      tunerLoop();
    } catch(err){
      if(err && err.name === 'NotAllowedError'){
        alert(
          '마이크 권한이 차단되어 있어요.\n\n' +
          '안드로이드: 휴대폰 설정 › 앱 › 고쟁 음정 체크 › 권한 › 마이크 → 허용\n' +
          'iOS: 설정 › Safari › 마이크 → 허용\n\n' +
          '허용 후 다시 눌러 주세요.'
        );
      } else {
        alert('마이크에 접근할 수 없습니다. 기기의 마이크 권한 설정을 확인해 주세요.');
      }
      tunerActive = false;
    }
  }

  function stopTuner(){
    tunerActive = false;
    if(tunerRAF) cancelAnimationFrame(tunerRAF);
    if(micStream) micStream.getTracks().forEach(t => t.stop());
    if(micSource) micSource.disconnect();
    if(analyser) analyser.disconnect();
    micStream = null; micSource = null; analyser = null;

    btnTuning.classList.remove('active');
    btnTuning.textContent = '🎙 튜닝';
    tunerPanel.hidden = true;
  }

  btnTuning.addEventListener('click', () => {
    if(tunerActive) stopTuner();
    else startTuner();
  });

})();
</script>
</body>
</html>
